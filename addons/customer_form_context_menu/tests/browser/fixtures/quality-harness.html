<!doctype html>
<html lang="en" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer form context-menu quality harness</title>
  <style>
    :focus { outline: 3px solid #714b67; outline-offset: 2px; }
    body { background: #fff; color: #212529; font: 16px system-ui, sans-serif; margin: 1rem; }
    #menu { border: 1px solid #714b67; max-width: min(22rem, calc(100vw - 1rem)); padding: .5rem; }
    [role="menuitem"] { padding: .6rem; }
    [aria-disabled="true"] { color: #6c757d; }
  </style>
</head>
<body>
  <form data-form-root="quality-form"><input aria-label="Quality input"><div style="height: 3rem"></div></form>
  <div id="menu" role="menu" aria-label="Context menu" aria-orientation="vertical" tabindex="-1">
    <div role="group" aria-label="Navigation">
      <div id="enabled" role="menuitem" tabindex="0">Refresh record</div>
      <div id="disabled" role="menuitem" tabindex="-1" aria-disabled="true" aria-describedby="reason">Next record</div>
      <span id="reason">This is the last record.</span>
    </div>
  </div>
  <output id="result" data-status="pending"></output>
  <output id="console-capture"></output>
  <script>
    (() => {
      const started = performance.now();
      const errors = [];
      const originalError = console.error;
      console.error = (...args) => { errors.push(args.join(" ")); originalError(...args); };
      const checks = [];
      const check = (name, value) => checks.push({ name, passed: Boolean(value) });
      const menu = document.querySelector("#menu");
      let rpcCalls = 0;
      const originalFetch = window.fetch;
      window.fetch = (...args) => { rpcCalls += 1; return originalFetch(...args); };
      const before = document.body.getBoundingClientRect().height;
      menu.querySelector("#enabled").focus();
      const openedIn = performance.now() - started;
      check("menu opens within 100ms", openedIn < 100);
      check("menu role and accessible name", menu.getAttribute("role") === "menu" && menu.getAttribute("aria-label") === "Context menu");
      check("group and item semantics", Boolean(menu.querySelector('[role="group"] [role="menuitem"]')));
      check("disabled reason is described", document.querySelector("#disabled").getAttribute("aria-describedby") === "reason");
      check("disabled item remains reachable", document.querySelector("#disabled").getAttribute("tabindex") === "-1");
      check("focus is visible", getComputedStyle(document.querySelector("#enabled")).outlineStyle !== "none");
      check("RTL direction is active", document.documentElement.dir === "rtl");
      document.body.style.zoom = "2";
      check("200 percent zoom keeps menu in document", menu.getBoundingClientRect().width > 0 && menu.getBoundingClientRect().height > 0);
      check("opening causes no layout shift", document.body.getBoundingClientRect().height >= before);
      check("opening performs no RPC", rpcCalls === 0);
      check("no unexpected console errors", errors.length === 0);
      document.querySelector("#console-capture").textContent = JSON.stringify(errors);
      const passed = checks.every(({ passed }) => passed);
      const result = document.querySelector("#result");
      result.dataset.status = passed ? "passed" : "failed";
      result.textContent = JSON.stringify({ passed, openedIn, checks });
    })();
  </script>
</body>
</html>
