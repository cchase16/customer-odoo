# Human-maintained contract between this product repository and the Odoo
# Development Factory. Values marked null must be resolved before a governed run.
schema_version: 1

project:
  id: customer-odoo
  type: odoo-addons

odoo:
  version: 19.0, build 20260802
  edition: community
  addon_paths:
    - addons

delivery:
  repository: customer-odoo-delivery
  local_path: ../customer-odoo-delivery

conventions:
  generic_prefix: CW
  system_name_format: "CW_{PascalCaseName}"
  module_prefix: cw_
  legacy_module_prefixes:
    - customer_
  license: LGPL-3

quality_gates:
  required:
    - manifest_validation
    - lint
    - unit_tests
    - browser_tests

release:
  integration_branch: develop
  production_branch: main
  require_qa_approval: true
  require_production_upgrade_rehearsal: true
